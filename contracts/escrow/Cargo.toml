[package]
name = "proofarena-escrow"
version = "0.1.0"
edition = "2021"
description = "ProofArena native-NEAR escrow: one reward, one approved winner, exactly-once settlement"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

# `unit-testing` is deliberately NOT enabled here. It pulls near-vm-runner and
# aws-lc-sys into every build, which bloats (and can break) the wasm32 build.
# It is enabled only for `cargo test` below, where it is actually needed.
[dependencies]
near-sdk = "5.9.0"

[dev-dependencies]
near-sdk = { version = "5.9.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
