[package]
name = "proofarena-escrow"
version = "0.1.0"
edition = "2021"
description = "ProofArena native-NEAR escrow: one reward, one approved winner, exactly-once settlement"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = { version = "5.9.0", features = ["unit-testing"] }

[dev-dependencies]
near-sdk = { version = "5.9.0", features = ["unit-testing"] }
tokio = { version = "1", features = ["macros"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
