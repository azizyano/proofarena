[project]
name = "proofarena"
version = "0.1.0"
description = "Verifiable AI security work with owner-approved NEAR escrow"
requires-python = ">=3.11"
dependencies = [
    "starlette==0.41.3",
    "uvicorn==0.34.0",
    "pydantic==2.10.4",
    "jinja2==3.1.6",
    "jsonschema==4.26.0",
    "cryptography==47.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "httpx==0.28.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["proofarena*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:pytest_ethereum -p no:cacheprovider --strict-markers"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
